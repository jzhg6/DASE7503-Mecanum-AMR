name: ROS 2 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y \
            --skip-keys "gazebo gazebo_ros gazebo_plugins"

      - name: Build
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Test
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test --return-code-on-test-failure

      - name: HW bridge kinematics test
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE/src/mecanum_hw_bridge \
            python3 src/mecanum_hw_bridge/test/test_kinematics.py

      - name: QR mission schema test
        run: |
          python3 src/mecanum_task_manager/test/test_qr_payload.py

      - name: Python syntax check
        run: |
          python3 -m compileall -q src

      - name: STM32 protocol host test
        run: |
          make -C hardware/legacy_stm32_upstream build_host
          ./hardware/legacy_stm32_upstream/main_host

  esp32-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio
      - name: Build safe-default firmware
        run: pio run -d firmware/esp32
