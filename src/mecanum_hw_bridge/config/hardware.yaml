hardware_supervisor:
  ros__parameters:
    command_ack_timeout_sec: 4.0
    wheel_odom_topic: /wheel/odom
    odom_topic: /odom
    odom_frame: odom
    base_frame: base_footprint
    publish_odom_tf: true

oradar_ms200:
  ros__parameters:
    device_model: MS200
    frame_id: lidar_link
    scan_topic: /scan
    port_name: /dev/oradar
    baudrate: 230400
    angle_min: 0.0
    angle_max: 360.0
    range_min: 0.05
    range_max: 20.0
    clockwise: false
    motor_speed: 10
