# Hardware bridge parameters (Raspberry Pi -> ESP32 UART)
# Override via launch args or environment as needed.

hw_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    # Mecanum kinematics (match your robot)
    wheel_radius: 0.05
    lx: 0.115
    ly: 0.125
    max_wheel_speed: 10.0
    # Safety
    cmd_timeout_sec: 0.5
    motion_rate_hz: 25.0
    reconnect_interval_sec: 2.0
    # Servo positions must be calibrated with the mechanism unloaded.
    servo_channel: 0
    servo_up_deg: 120.0
    servo_down_deg: 35.0
